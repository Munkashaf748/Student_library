<!DOCTYPE html>
<html>
    <head>
        <title>CSE Subject</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 50px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 198, 255, 0.3);
        }

        button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.15rem;
            font-weight: 500;
            padding: 16px 40px;
            margin: 12px 0;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            min-width: 280px;
        }

        button:hover {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-color: transparent;
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 114, 255, 0.4);
        }

        button a {
            color: inherit;
            text-decoration: none;
            display: block;
        }

        button:hover a {
            color: #fff;
        }
    </style>
    </head>
    <body>
        <h1><b>Subject</b></h1>
        <button><a href="https://drspmaths.wordpress.com/wp-content/uploads/2019/01/advanced-engineering-mathematics_by-erwin-kreyszig-__10th_edition-1.pdf" target="_blank">Mathematics</a></button><br><br>
        <button><a href="https://www.emgywomenscollege.ac.in/templateEditor/kcfinder/upload/files/C_Programming.pdf" target="_blank">Programming Fundamentals</a></button><br><br>
        <button><a href="https://www.gacbe.ac.in/images/E%20books/Electronic%20Devices%20and%20Circuit%20Theory.pdf" target="_blank">Basic Electronic & Communication Engineering</a></button><br><br>
        <button><a href="https://soaneemrana.com/onewebmedia/ENGINEERING%20DRAWING%20BY%20N.D%20BHATT.pdf" target="_blank">Computer Aided Engineering Graphic - 2</a></button><br><br>
        <button><a href="https://soclibrary.futa.edu.ng/books/Beginning%20CSS%20For%20Web%20Design%20Third%20Edition.pdf" target="_blank">Web Designing</a></button><br><br>
    </body>
</html>
